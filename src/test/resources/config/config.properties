# =============================================
# config.properties — default (local Chrome)
# Override any value in Jenkins via -Dproperty=value
# =============================================

# Browser: chrome | firefox | chrome-headless
browser=chrome

# Base URL — the-internet is a free Selenium practice site, no setup needed
base.url=https://the-internet.herokuapp.com/login

# Timeouts (seconds)
default.timeout=10
page.load.timeout=30

# =============================================
# AWS S3 — leave blank to skip S3 uploads locally
# On EC2, these are set as Jenkins env vars
# =============================================
s3.bucket.name=
s3.region=ap-south-1

# =============================================
# Database — update with your actual DB details
# Leave as-is; DB tests are commented out by default
# =============================================
db.url=jdbc:mysql://localhost:3306/testdb
db.username=root
db.password=

# CloudWatch log group name (used in aws/cloudwatch-config.json)
cloudwatch.log.group=/selenium/test-runs
